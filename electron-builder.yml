appId: io.github.prapawity.gitverse
productName: GITVerse
directories:
  output: release
extraResources:
  - from: resources/icon.png
    to: icon.png
files:
  - dist/**/*
  - dist-electron/main/**/*
  - dist-electron/preload/**/*
  - package.json
  - LICENSE
asar: true
artifactName: GITVerse-${version}-${os}-${arch}.${ext}
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: src/assets/gitverse-mark.svg
  category: Development
  maintainer: prapawity
  target:
    - AppImage
