version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; TypeScript 7 (the native compiler) has no
      # JS API for it yet. Remove once typescript-eslint lists TypeScript 7 in its peer range.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
