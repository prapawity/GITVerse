name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: both
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const v = require('./package.json').version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.RELEASE_TAG !== 'v' + v) throw new Error('Use a stable vX.Y.Z tag matching package.json');"
      - run: npm ci
      - run: npm test
      - name: Build macOS universal architecture set
        if: matrix.target == 'mac'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$MAC_CERTIFICATE_P12" && -n "$MAC_CERTIFICATE_PASSWORD" ]]; then
            CSC_LINK="$MAC_CERTIFICATE_P12" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD" npm run dist -- --mac --x64 --arm64
          else
            npm run dist -- --mac --x64 --arm64
          fi
      - name: Build platform
        if: matrix.target != 'mac'
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Generate checksums
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = mac ]; then
            node scripts/checksums.cjs mac-arm64
            node scripts/checksums.cjs mac-x64
          else
            node scripts/checksums.cjs ${{ matrix.target }}-${{ matrix.arch }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-*.txt

  draft-release:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --generate-notes --title "GITVerse $RELEASE_TAG"
