name: Release (Tauri preview)

# Installers of the Tauri build. Until the Tauri build replaces the Electron one they are kept as
# workflow artifacts (not attached to the GitHub Release). Run by hand from the Actions tab, or on a
# release tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # also when the packaging itself changes, so it is tested before a release
    paths:
      - .github/workflows/release-tauri.yml
      - scripts/stage-copilot.mjs
      - scripts/sidecar-smoke.mjs
      - src-tauri/tauri.release.conf.json

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: npm ci
      # notices + Copilot sidecar (Node, SDK and this platform's runtime) + installer
      - run: npm run release:tauri
      - name: Check that the bundle carries the Copilot sidecar and Node
        shell: bash
        run: |
          set -e
          test -f src-tauri/copilot/copilot-sidecar.mjs
          ls src-tauri/binaries/
          find src-tauri/target/release/bundle -maxdepth 2 -type f | head -20
          if [ "$RUNNER_OS" = macOS ]; then
            app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            test -x "$app/Contents/MacOS/node"
            test -f "$app/Contents/Resources/copilot/copilot-sidecar.mjs"
            test -d "$app/Contents/Resources/copilot/node_modules/@github/copilot-sdk"
          fi
      - name: Smoke-test the staged sidecar with the bundled Node
        run: node scripts/sidecar-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gitverse-tauri-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
