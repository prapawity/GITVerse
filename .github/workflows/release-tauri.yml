name: Release

# Build installers on each platform and publish a draft release for review.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # branch pushes run only when the packaging changes (paths are ignored for tag pushes)
    branches: ['**']
    # also when the packaging itself changes, so it is tested before a release
    paths:
      - .github/workflows/release-tauri.yml
      - scripts/stage-copilot.mjs
      - scripts/sidecar-smoke.mjs
      - src-tauri/tauri.release.conf.json

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            updater: windows-x86_64
          - os: macos-15
            name: macos-arm64
            updater: darwin-aarch64
          - os: macos-15-intel
            name: macos-x64
            updater: darwin-x86_64
          - os: ubuntu-22.04
            name: linux-x64
            updater: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace -- --skip keychain_round_trip
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs = require('fs'); const v = require('./package.json').version; const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.RELEASE_TAG !== 'v' + v || require('./src-tauri/tauri.conf.json').version !== v || cargo !== v) throw new Error('Tag, package.json, Tauri config and Cargo.toml versions must match');"
      # notices + Copilot sidecar (Node, SDK and this platform's runtime) + installer. With the
      # updater key configured (docs/rust-migration/updater.md) the build is also signed for the
      # in-app updater; without it the installers are built without updates.
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the public key may be stored as a variable or as a secret
          UPDATER_PUBKEY: ${{ vars.GITVERSE_UPDATER_PUBKEY || secrets.GITVERSE_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            echo "SIGNED_UPDATES=1" >> "$GITHUB_ENV"
            # the CLI checks the signing key against plugins.updater.pubkey, so put the key in the config too
            node -e "require('fs').writeFileSync('src-tauri/tauri.pubkey.conf.json', JSON.stringify({ plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY.trim() } } }))"
            GITVERSE_UPDATER_PUBKEY="$UPDATER_PUBKEY" npm run release:tauri -- --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.pubkey.conf.json
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Updater signing keys are required for a release."
              exit 1
            fi
            echo "::notice::Updater key not configured: building installers without in-app updates."
            npm run release:tauri
          fi
      - name: Check that the bundle carries the Copilot sidecar and Node
        shell: bash
        run: |
          set -e
          test -f src-tauri/copilot/copilot-sidecar.mjs
          ls src-tauri/binaries/
          find src-tauri/target/release/bundle -maxdepth 2 -type f | head -20
          if [ "$RUNNER_OS" = macOS ]; then
            app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            test -x "$app/Contents/MacOS/node"
            test -f "$app/Contents/Resources/copilot/copilot-sidecar.mjs"
            test -d "$app/Contents/Resources/copilot/node_modules/@github/copilot-sdk"
          fi
      - name: Smoke-test the staged sidecar with the bundled Node
        run: node scripts/sidecar-smoke.mjs
      - name: Collect the signed updater bundle
        if: env.SIGNED_UPDATES == '1'
        run: node scripts/updater-collect.mjs ${{ matrix.updater }}
      - name: Collect macOS installer
        if: env.SIGNED_UPDATES == '1' && runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1 && test -f "${dmg[0]}"
          cp "${dmg[0]}" "updater-out/GITVerse_${version}_${{ matrix.updater }}.dmg"
      - uses: actions/upload-artifact@v7
        if: env.SIGNED_UPDATES == '1'
        with:
          name: updater-${{ matrix.name }}
          if-no-files-found: error
          path: updater-out/*
      - uses: actions/upload-artifact@v7
        with:
          name: gitverse-tauri-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # Publish only after every platform has produced a signed updater bundle.
  updater-feed:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: updater-*
          merge-multiple: true
          path: updater-out
      - name: Publish latest.json and the update bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            test -f "updater-out/$platform.json"
          done
          node scripts/updater-manifest.mjs updater-out "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" updater-out/latest.json updater-out/GITVerse_* --verify-tag --draft --generate-notes --title "GITVerse $RELEASE_TAG"
