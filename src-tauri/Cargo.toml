[package]
name = "gitverse"
version = "1.0.0"
description = "A desktop Git client with commit graphs, conflict tools, and optional AI assistance."
authors = ["GITVerse contributors"]
license = "MIT"
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "gitverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitverse-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
