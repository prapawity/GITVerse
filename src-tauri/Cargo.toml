[package]
name = "gitverse-by-prapawity"
version = "1.0.3"
description = "A desktop Git client with commit graphs, conflict tools, and optional AI assistance."
authors = ["PRAPAWITY"]
license = "MIT"
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "gitverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitverse-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
hex = "0.4"
tokio-util = "0.7"
tokio = { version = "1", features = ["time"] }

# Keep debug builds small (target/ grew past 15 GB with full debug info): line tables are enough
# for panics with file:line, and dependencies need no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
