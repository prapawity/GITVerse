[package]
name = "gitverse-core"
version = "0.1.0"
edition = "2021"
description = "GITVerse by PRAPAWITY backend logic without any UI runtime: Git runner, parsers, state."
license = "MIT"

[dependencies]
portable-pty = "0.9"
tempfile = "3"
base64 = "0.22"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
getrandom = "0.2"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
