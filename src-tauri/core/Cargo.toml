[package]
name = "gitverse-core"
version = "0.1.0"
edition = "2021"
description = "GITVerse backend logic without any UI runtime: Git runner, parsers, state."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
