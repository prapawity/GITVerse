<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 128" fill="none">
  <title>GITVerse</title>
  <style>
    @keyframes twinkle { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    .spark { animation: twinkle 4s ease-in-out infinite; }
    .spark-slow { animation-duration: 6s; animation-delay: -2s; }
    .spark-fast { animation-duration: 3s; animation-delay: -1s; }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="nebula" x1="10" y1="108" x2="116" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".25" />
      <stop offset=".45" stop-color="#A855F7" stop-opacity=".45" />
      <stop offset=".7" stop-color="#E879F9" stop-opacity=".4" />
      <stop offset="1" stop-color="#6366F1" stop-opacity=".18" />
    </linearGradient>
    <filter id="nebula-cloud" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".065" numOctaves="3" seed="7" result="dust" />
      <feDisplacementMap in="SourceGraphic" in2="dust" scale="18" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="orbit" x1="16" y1="94" x2="112" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="graph" x1="44" y1="100" x2="86" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <g filter="url(#nebula-cloud)" stroke="url(#nebula)" stroke-linecap="round">
    <path d="M14 88C-2 72 23 36 56 29S113 18 114 43C115 57 80 65 67 79S22 110 16 99" stroke-width="18" />
    <path d="M29 111C54 110 97 86 108 66S103 40 89 39" stroke-width="11" />
  </g>
  <g fill="#C084FC">
    <path class="spark spark-slow" d="M18 13L20 19L26 21L20 23L18 29L16 23L10 21L16 19Z" />
    <path class="spark spark-fast" d="M111 12L112.5 16.5L117 18L112.5 19.5L111 24L109.5 19.5L105 18L109.5 16.5Z" />
    <circle class="spark" cx="14" cy="108" r="1.7" />
    <circle class="spark spark-slow" cx="119" cy="75" r="1.7" />
    <circle class="spark spark-fast" cx="71" cy="12" r="1.3" />
  </g>
  <ellipse cx="64" cy="64" rx="54" ry="26" transform="rotate(-30 64 64)" stroke="url(#orbit)" stroke-width="3.5" />
  <path d="M44 85V41M44 76C44 57 86 74 86 53" stroke="url(#graph)" stroke-width="9" stroke-linecap="round" />
  <circle cx="44" cy="30" r="10" fill="#ECFEFF" stroke="#22D3EE" stroke-width="7" />
  <circle cx="86" cy="42" r="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="7" />
  <circle cx="44" cy="96" r="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="7" />
  <path class="spark" d="M105 86L107.5 93.5L115 96L107.5 98.5L105 106L102.5 98.5L95 96L102.5 93.5Z" fill="#C084FC" />
  <text x="140" y="84" fill="#0891B2" font-family="Trebuchet MS, sans-serif" font-size="58" font-weight="700">GIT<tspan fill="#A855F7" font-weight="400">Verse</tspan></text>
</svg>