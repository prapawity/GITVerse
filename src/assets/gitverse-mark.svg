<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none"><title>GITVerse by PRAPAWITY Planet</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#313244"/><stop offset=".45" stop-color="#1E1E2E"/><stop offset="1" stop-color="#11111B"/></linearGradient>
  <radialGradient id="planet" cx=".35" cy=".3" r=".85"><stop stop-color="#F9E2AF"/><stop offset=".4" stop-color="#FAB387"/><stop offset=".8" stop-color="#E0785A"/><stop offset="1" stop-color="#9A4A3A"/></radialGradient>
  <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4CC2FF"/><stop offset="1" stop-color="#7DD3FF"/></linearGradient>
  <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B48EF0"/><stop offset="1" stop-color="#CBA6F7"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="front"><rect x="0" y="256" width="512" height="256"/></clipPath>
  <clipPath id="back"><rect x="0" y="0" width="512" height="256"/></clipPath>
</defs>
<g id="mark">
  <g transform="rotate(-18 256 256)">
    <!-- back halves of rings -->
    <g clip-path="url(#back)" fill="none" stroke-width="16" stroke-linecap="round">
      <ellipse cx="256" cy="256" rx="214" ry="62" stroke="url(#ringA)" opacity=".55"/>
      <ellipse cx="256" cy="256" rx="176" ry="46" stroke="url(#ringB)" opacity=".55"/>
    </g>
  </g>
  <!-- planet -->
  <circle cx="256" cy="256" r="128" fill="#FAB387" opacity=".3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="120" fill="url(#planet)"/>
  <path d="M150 220Q256 190 362 226" stroke="#FFF7ED" stroke-opacity=".25" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M146 290Q256 268 368 300" stroke="#7C2D12" stroke-opacity=".3" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="214" cy="190" rx="34" ry="20" transform="rotate(-30 214 190)" fill="#fff" opacity=".55"/>
  <g transform="rotate(-18 256 256)">
    <!-- front halves -->
    <g clip-path="url(#front)" fill="none" stroke-width="16" stroke-linecap="round">
      <ellipse cx="256" cy="256" rx="214" ry="62" stroke="url(#ringA)"/>
      <ellipse cx="256" cy="256" rx="176" ry="46" stroke="url(#ringB)"/>
    </g>
    <!-- commit moons on rings -->
    <circle cx="42" cy="256" r="18" fill="#E8F6FF" stroke="#4CC2FF" stroke-width="9"/>
    <circle cx="256" cy="318" r="18" fill="#E8F6FF" stroke="#4CC2FF" stroke-width="9"/>
    <circle cx="432" cy="256" r="16" fill="#FDF4FF" stroke="#CBA6F7" stroke-width="9"/>
  </g>
  <g fill="#CBA6F7">
    <path d="M400 70l5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/>
    <path d="M96 400l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <circle cx="120" cy="110" r="4"/><circle cx="430" cy="400" r="4"/>
  </g>
</g>
</svg>
